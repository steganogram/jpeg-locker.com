<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hexPattern" patternUnits="userSpaceOnUse" width="56" height="100">
      <path d="M28 66L0 50V16L28 0l28 16v34L28 66zm0-6l22-14V22L28 8 6 22v24l22 14z" fill="white" fill-opacity="0.03"/>
    </pattern>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0b"/>
  <rect width="1200" height="630" fill="url(#hexPattern)"/>
  
  <!-- Glow effect -->
  <ellipse cx="600" cy="280" rx="300" ry="200" fill="url(#accentGradient)" opacity="0.1"/>
  
  <!-- Logo hexagon -->
  <g transform="translate(510, 140)" filter="url(#glow)">
    <path d="M90 10L170 56V148L90 194L10 148V56L90 10Z" stroke="url(#accentGradient)" stroke-width="3" fill="none"/>
    <path d="M90 50L130 73V119L90 142L50 119V73L90 50Z" fill="url(#accentGradient)"/>
    <circle cx="90" cy="96" r="12" fill="#0a0a0b"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="white" text-anchor="middle">JPEG Locker</text>
  
  <!-- Subtitle -->
  <text x="600" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#a1a1aa" text-anchor="middle">Hide secrets in plain sight</text>
  
  <!-- Tagline -->
  <text x="600" y="520" font-family="monospace" font-size="16" fill="#22d3ee" text-anchor="middle">Steganography that survives social media</text>
</svg>
