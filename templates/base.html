<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}{{ config.title }}{% endblock %}</title>
        <meta name="description" content="{{ config.description }}" />

        <!-- Open Graph -->
        <meta property="og:title" content="{{ config.title }}" />
        <meta property="og:description" content="{{ config.description }}" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="{{ config.base_url }}" />
        <meta property="og:image" content="{{ config.base_url }}/images/og-image.png" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="{{ config.title }}" />
        <meta name="twitter:description" content="{{ config.description }}" />

        <!-- Favicon -->
        <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <!-- Styles -->
        <link rel="stylesheet" href="/style.css" />

        <!-- Privacy-friendly analytics by Plausible -->
        <script async src="https://plausible.io/js/pa-PPvmT4SvhiEzifZlQ6BCN.js"></script>
        <script>
            ((window.plausible =
                window.plausible ||
                function () {
                    (plausible.q = plausible.q || []).push(arguments);
                }),
                (plausible.init =
                    plausible.init ||
                    function (i) {
                        plausible.o = i || {};
                    }));
            plausible.init();
        </script>
    </head>
    <body>
        <div class="hex-grid" aria-hidden="true"></div>
        <div class="scanlines" aria-hidden="true"></div>

        {% block content %}{% endblock %}

        <script>
            // Intersection Observer for animations
            const observerOptions = {
                threshold: 0.1,
                rootMargin: "0px 0px -50px 0px",
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("visible");
                    }
                });
            }, observerOptions);

            document.querySelectorAll(".animate-in").forEach((el) => observer.observe(el));

            // Waitlist form handling
            document.querySelectorAll(".waitlist-form").forEach((form) => {
                form.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const button = form.querySelector("button");
                    const formMessage = form.querySelector(".form-message");

                    button.disabled = true;
                    button.innerHTML = '<span class="loading"></span>';

                    try {
                        const response = await fetch(form.action, {
                            method: "POST",
                            body: new FormData(form),
                            headers: {
                                Accept: "application/json",
                            },
                        });

                        if (response.ok) {
                            form.classList.add("success");
                            if (formMessage) {
                                formMessage.textContent = "You're on the list. We'll be in touch.";
                                formMessage.classList.add("show", "success");
                            }
                            form.reset();
                        } else {
                            throw new Error("Submission failed");
                        }
                    } catch (error) {
                        if (formMessage) {
                            formMessage.textContent = "Something went wrong. Try again.";
                            formMessage.classList.add("show", "error");
                        }
                    }

                    button.disabled = false;
                    button.innerHTML =
                        'Join Waitlist <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
                });
            });

            // Parallax effect for hero
            window.addEventListener("scroll", () => {
                const scrolled = window.pageYOffset;
                const hero = document.querySelector(".hero-visual");
                if (hero) {
                    hero.style.transform = `translateY(${scrolled * 0.3}px)`;
                }
            });
        </script>
    </body>
</html>
